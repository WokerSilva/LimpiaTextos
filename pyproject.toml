[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limpiatextos"
version = "0.1.0"
description = "Pipeline offline para limpieza y extracción de texto de PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pypdf>=4.0.0",
]

[project.scripts]
limpiatextos = "limpiatextos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["limpiatextos*"]
